<script>
(function(){"use strict";
const APP_VERSION="2026.11.19-4679d4";
const $=id=>document.getElementById(id);

const ENDS=["WR","BP","CP","O"],isEnd=c=>ENDS.includes(c),isTurn=c=>c==="rt"||c==="lt";
const uid=()=>"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const frq=v=>v==null?"—":fr(v)+'"';
const NAME={g:"the g (ground under the nose)",bn:"the bottom nose (bn)",tn:"the top nose (tn)",rt:"the turn",lt:"the turn",WR:"the wall (WR)",BP:"the bent post (BP)",CP:"the coped post (CP)",O:"the open end (O)"};
const ENDOPT=[{v:"WR",label:"WR",sub:"Wall return"},{v:"BP",label:"BP",sub:"Bent post"},{v:"CP",label:"CP",sub:"Coped post"},{v:"O",label:"O",sub:"Open end"}];
const TURNOPT=[{v:0,label:"Straight",sub:"No turn (0)"},{v:90,label:"One turn",sub:"90"},{v:180,label:"U-turn",sub:"180 (two turns)"}];

/* ================= model =================
 rail = {id,job,name,hand,kind,standoff,w:{start:{end,turn,legs[]},pipes:[{riser,nn,rise,mids[],after,land:{legs[]}}],end:{turn,code,legs[]}},rows,mp,out}
 rows/mp are derived from w so the export is the same v3 file as the Field Sheet. */
function blankW(){return{start:{end:null,turn:null,legs:[]},pipes:[],end:{turn:null,code:null,legs:[]}}}
function fitLegs(b,t){if(t==null){return}const n=nLegs(t);b.legs=b.legs||[];while(b.legs.length<n)b.legs.push({});b.legs.length=n}
function newPipe(){return{riser:null,nn:null,rise:null,mids:[],midCount:null,after:null,land:{turn:null,legs:[]}}}
function normalize(r){
  const w=r.w;fitLegs(w.start,w.start.turn);
  if(w.start.end!=null&&w.start.turn!=null&&!w.pipes.length)w.pipes.push(newPipe());
  for(let p=0;p<w.pipes.length;p++){const P=w.pipes[p];
    if(P.midCount!=null){while(P.mids.length<P.midCount)P.mids.push({mount:"top"});P.mids.length=P.midCount}
    if(P.after==null||P.after==="end"){w.pipes.length=p+1;break}
    fitLegs(P.land,P.after);if(p===w.pipes.length-1)w.pipes.push(newPipe())}
  const last=w.pipes[w.pipes.length-1];
  if(last&&last.after==="end")fitLegs(w.end,w.end.turn);
  derive(r);

const KEEP=["len","rise","angle","stud","mount","standoff","flange","flangeFace","plateAlong","plateCross","postAdjust"];
let REFS=[];
function derive(r){
  const w=r.w,rows=[],refs=[],D=defDir(r);
  const block=(from,to,legs)=>{const codes=[from];for(let k=0;k<legs.length-1;k++)codes.push(legs[k].dir||D);codes.push(to);
    legs.forEach((L,k)=>{const x={from:codes[k],to:codes[k+1]};KEEP.forEach(f=>{if(L[f]!=null)x[f]=L[f]});
      if(!isTurn(x.to))delete x.angle;if(x.from!=="WR"&&x.to!=="WR")delete x.stud;rows.push(x);refs.push(L)})};
  if(w.start.end==null||w.start.turn==null){r.rows=rows;r.mp=[];REFS=refs;return}
  block(w.start.end,"g",w.start.legs);
  w.pipes.forEach((P,p)=>{
    rows.push(P.riser==null?{from:"g",to:"bn"}:{from:"g",to:"bn",len:P.riser});refs.push({pipe:p,f:"riser"});
    const fl={from:"bn",to:"tn"};if(P.nn!=null)fl.len=P.nn;if(P.rise!=null)fl.rise=P.rise;rows.push(fl);refs.push({pipe:p,f:"nn"});
    if(P.after!=null&&P.after!=="end")block("tn","g",P.land.legs);
  });
  const last=w.pipes[w.pipes.length-1];
  if(last&&last.after==="end"&&w.end.turn!=null&&w.end.code)block("tn",w.end.code,w.end.legs);
  const mp=[];
  r.rows=rows;r.mp=mp;REFS=refs;r.layout="cont";
}

/* ================= checks + export (same rules and v3 shape as the Field Sheet) ================= */
const postEnd=(rows,i)=>{const x=rows[i];return(i===0&&(x.from==="BP"||x.from==="CP"))||(i===rows.length-1&&(x.to==="BP"||x.to==="CP"))};
function wrExempt(rows,i){const r=rows[i];if(i===0&&r.from==="WR"&&r.to==="g")return true;if(i===rows.length-1&&r.from==="tn"&&r.to==="WR")return true;
  if(i===0&&r.from==="WR"&&isTurn(r.to)){const n=rows[1];return!(n&&isTurn(n.from)&&isTurn(n.to))}
  if(i===rows.length-1&&r.to==="WR"&&isTurn(r.from)){const p=rows[i-1];return!!p&&!(isTurn(p.from)&&isTurn(p.to))}return false}
function flights(r){const f=[];r.rows.forEach((x,i)=>{if(x.from==="bn"&&x.to==="tn")f.push(i)});return f}
function check(r){
  const out=[],rows=r.rows;
  if(!(r.job||"").trim()||!(r.name||"").trim())out.push("Give the rail a job and a stair name.");
  if(!r.hand)out.push("Pick which hand the rail is on going up.");
  if(!r.kind)out.push("Pick which rails: inside only, inside and outside, or outside/freehand.");
  if(!rows.length){out.push("No bottom start yet.");return out}

async function sendOut(){const ob=obGet(),names=Object.keys(ob);if(!names.length||!getPin()||!navigator.onLine)return;
  for(const n of names){try{const res=await postJson(n,ob[n]);if(res&&res.ok){const o=obGet();if(o[n]===ob[n]){delete o[n];obSet(o)}markSent(n,ob[n]);setSt("sent "+n+" to the office");toastOk("✓ Sent "+n.replace(/ handrails v3\.json$/,"")+" to the office");if(view.mode==="home"||(view.mode==="wiz"&&steps(rails[view.rail])[view.i].type==="review"))render()}
    else if(res&&res.error==="bad pin"){setPin("");askPin("That PIN didn't work. Check it and try again.",sendOut);return}else{setSt("office didn't take "+n+": "+(res&&res.error||"no reply"),"err");return}}
  catch(e){setSt("no signal: "+names.length+" file(s) waiting to send","err");return}}}
const SENT="handrailWizard.sent";
const hashStr=t=>{let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return String(h)};
const jobName=job=>job.replace(/[^\w\- ]+/g,"").trim()+" handrails v3.json";
const jobJson=job=>JSON.stringify(payload(job),null,1);
function markSent(name,json){try{const o=JSON.parse(localStorage.getItem(SENT)||"{}");o[name]={h:hashStr(json),at:Date.now()};localStorage.setItem(SENT,JSON.stringify(o))}catch(e){}}
function sendState(job){const n=jobName(job),j=jobJson(job);if(obGet()[n]===j)return"wait";try{const o=JSON.parse(localStorage.getItem(SENT)||"{}")[n];if(o&&o.h===hashStr(j))return"sent"}catch(e){}return""}
function sendBtn(job,cls,label){const st=sendState(job);
  return el("button",{type:"button",class:cls+(st==="sent"?" sent":st==="wait"?" wait":" pri"),text:st==="sent"?"✓ Sent to office":st==="wait"?"Waiting for signal…":label,onclick:()=>exportJob(job)})}
function toastOk(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const d=el("div",{class:"toast ok",role:"status"},t);document.body.append(d);setTimeout(()=>d.remove(),3500)}
async function exportJob(job){
  const p=payload(job),bad=Object.values(rails).filter(r=>(r.job||"").trim()===job&&check(r).length).length;
  const name=job.replace(/[^\w\- ]+/g,"").trim()+" handrails v3.json";
  const ob=obGet();ob[name]=JSON.stringify(p,null,1);obSet(ob);
  if(bad)setSt(bad+" rail(s) still have issues, sending anyway…","err");else setSt("sending…");
  if(!getPin()){askPin(null,sendOut);return}
  if(!navigator.onLine){setSt("no signal: will send when back online","err");render();return}
  await sendOut()}
addEventListener("online",()=>sendOut());
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")sendOut()});
addEventListener("load",()=>setTimeout(sendOut,2500));
async function copyJob(job){try{await navigator.clipboard.writeText(JSON.stringify(payload(job),null,1));setSt("JSON copied")}catch(e){setSt("couldn't copy","err")}}

/* ================= boot ================= */
lsLoad();Object.values(rails).forEach(r=>{if(!r.w)r.w=blankW()});render();
setSt("saved on this phone");
/* ---------- updater: compares this copy with version.json on GitHub ---------- */
let updShown=false;
async function checkUpdate(manual){
  const b=$("chk");if(manual&&b)b.textContent="Checking…";
  try{const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});const j=await r.json();
    if(j.v&&j.v!==APP_VERSION){showUpdate(j.v);if(b)b.textContent="Update ready"}
    else if(manual&&b){b.textContent="Up to date ✓";setTimeout(()=>{if($("chk"))$("chk").textContent="Check for updates"},2500)}}
  catch(e){if(manual&&b){b.textContent="No signal, try later";setTimeout(()=>{if($("chk"))$("chk").textContent="Check for updates"},2500)}}
}
function showUpdate(v){if(updShown)return;updShown=true;
  document.body.append(el("div",{class:"upd",role:"status"},el("span",{text:"Update ready"}),el("button",{type:"button",text:"Refresh",onclick:applyUpdate})))}
async function applyUpdate(){flushAll();lsSave();
  try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch(e){}
  try{const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(g=>g.update().catch(()=>{})))}catch(e){}
  location.reload()}
addEventListener("load",()=>setTimeout(()=>checkUpdate(false),1500));
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkUpdate(false)});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
window.__t={rails,steps,toV3,derive,normalize,check,blankW,payload};
})();
